<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 120; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes packetFlow {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .pulsing-glow-1 {
        transform-origin: 240px 120px;
        animation: pulse 8s ease-in-out infinite;
      }
      .pulsing-glow-2 {
        transform-origin: 960px 240px;
        animation: pulse 10s ease-in-out infinite alternate;
      }
      .pipeline-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 4s linear infinite;
      }
      .float-badge {
        animation: floatSlow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="850" y1="0" x2="850" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1150" y1="0" x2="1150" y2="400"/>

    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulsing-glow-1" cx="240" cy="120" r="280" fill="url(#glowCyan)"/>
  <circle class="pulsing-glow-2" cx="960" cy="240" r="300" fill="url(#glowViolet)"/>

  <!-- Background Dynamic MLOps Pipeline Vector (Behind Foreground Content) -->
  <g opacity="0.35">
    <!-- Curved pipeline stream -->
    <path class="pipeline-line" d="M 50 330 Q 300 290 600 320 T 1150 290" fill="none" stroke="url(#streamGrad)" stroke-width="2.5"/>
    <path class="pipeline-line" d="M 50 345 Q 300 380 600 340 T 1150 350" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 8"/>

    <!-- Neural node connections -->
    <circle cx="150" cy="325" r="4" fill="#06b6d4" />
    <circle cx="380" cy="305" r="5" fill="#3b82f6" />
    <circle cx="620" cy="322" r="5" fill="#8b5cf6" />
    <circle cx="860" cy="305" r="4" fill="#d946ef" />
    <circle cx="1080" cy="295" r="5" fill="#06b6d4" />
  </g>

  <!-- FOREGROUND CONTENT: Strictly on top of all animated background elements -->

  <!-- Top Pill / Badge -->
  <g class="float-badge" transform="translate(600, 75)" text-anchor="middle">
    <!-- Badge Background with border gradient -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#131d33" stroke="url(#badgeBorderGrad)" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Status indicator circle -->
    <circle cx="-210" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-195" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">ENTERPRISE AI &amp; MLOPS ECOSYSTEM</text>
    <text x="125" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="1">• 2026 EDITION</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Enterprise AI &amp; ML Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Enterprise MLOps • AutoML Engines • Feature Stores • Model Serving Infrastructure • Sovereign AI
  </text>

  <!-- Bottom Interactive Tech Capability Pills -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-410, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ MLflow</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-275, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">☸️ Kubeflow</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(-145, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🚀 vLLM</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(-20, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">☁️ Vertex AI</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(105, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fb923c">📦 SageMaker</text>
    </g>
    <!-- Tag 6 -->
    <g transform="translate(230, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">🏪 Feast</text>
    </g>
    <!-- Tag 7 -->
    <g transform="translate(365, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">🛡️ Azure AI</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="360" x2="900" y2="360" stroke="url(#titleGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
